[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-fetcher"
version = "0.3.0"
description = "A Python library for fetching copyright-free images from various sources like Pexels, Pixabay, Unsplash, and Flickr."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "beautifulsoup4"
]

[project.scripts]
stock-fetcher = "stock_fetcher.cli.main:app"

[project.optional-dependencies]
cli = [
    "typer",
    "rich"
]
mcp = [
    "mcp"
]
all = [
    "typer",
    "rich",
    "mcp"
]
dev = [
    "pre-commit",
    "ruff",
    "vcrpy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
