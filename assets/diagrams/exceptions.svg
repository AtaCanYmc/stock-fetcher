<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exceptions-title exceptions-desc" id="exceptions-root">
        <title id="exceptions-title">Stock Fetcher Exception Hierarchy</title>
        <desc id="exceptions-desc">Inheritance tree rooted at Python Exception through StockFetcherError to APIConnectionError, RateLimitExceededError, AuthenticationError, and ProviderNotFoundError.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #exceptions-root { --color-paper:   #0c0e12;
      --color-paper-2: #13171f;
      --color-ink:     #f8fafc;
      --color-muted:   #94a3b8;
      --color-soft:    #7c8da6;
      --color-accent:  #00d2ff;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #exceptions-root { font-family: var(--font-sans); color: var(--color-ink); }
      #exceptions-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#exceptions-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="exceptions-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
          <marker id="exceptions-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d2ff"/></marker>
        </defs>

        <!-- Background -->
        <rect x="0" y="0" width="800" height="448" rx="12" fill="#0c0e12"/>

        <!-- CONNECTORS (drawn before nodes, orthogonal tree bus) -->
        <!-- Exception -> StockFetcherError -->
        <line x1="400" y1="88" x2="400" y2="130" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#exceptions-arrow)"/>

        <!-- StockFetcherError -> Level 2 bus -->
        <line x1="400" y1="188" x2="400" y2="212" stroke="#00d2ff" stroke-width="1.2"/>
        <line x1="160" y1="212" x2="640" y2="212" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="160" y1="212" x2="160" y2="234" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#exceptions-arrow)"/>
        <line x1="400" y1="212" x2="400" y2="234" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#exceptions-arrow)"/>
        <line x1="640" y1="212" x2="640" y2="234" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#exceptions-arrow)"/>

        <!-- APIConnectionError -> RateLimitExceededError -->
        <line x1="160" y1="292" x2="160" y2="334" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#exceptions-arrow)"/>

        <!-- NODES -->
        <!-- Level 0: Exception -->
        <rect x="312" y="36" width="176" height="52" rx="6" fill="#0c0e12"/>
        <rect x="312" y="36" width="176" height="52" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.14"/>
        <text x="400" y="58" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">Exception</text>
        <text x="400" y="75" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Python built-in</text>

        <!-- Level 1: StockFetcherError (FOCAL) -->
        <rect x="296" y="132" width="208" height="56" rx="6" fill="#0c0e12"/>
        <rect x="296" y="132" width="208" height="56" rx="6" fill="#00d2ff" stroke="#00d2ff" stroke-width="1.5" fill-opacity="0.08"/>
        <text x="400" y="156" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">StockFetcherError</text>
        <text x="400" y="174" fill="#00d2ff" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stock_fetcher.exceptions</text>

        <!-- Level 2 Left: APIConnectionError -->
        <rect x="56" y="236" width="208" height="56" rx="6" fill="#0c0e12"/>
        <rect x="56" y="236" width="208" height="56" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.18"/>
        <text x="160" y="260" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">APIConnectionError</text>
        <text x="160" y="278" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Network or timeout error</text>

        <!-- Level 2 Center: AuthenticationError -->
        <rect x="296" y="236" width="208" height="56" rx="6" fill="#0c0e12"/>
        <rect x="296" y="236" width="208" height="56" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.18"/>
        <text x="400" y="260" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">AuthenticationError</text>
        <text x="400" y="278" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Invalid or missing key</text>

        <!-- Level 2 Right: ProviderNotFoundError -->
        <rect x="536" y="236" width="208" height="56" rx="6" fill="#0c0e12"/>
        <rect x="536" y="236" width="208" height="56" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.18"/>
        <text x="640" y="260" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">ProviderNotFoundError</text>
        <text x="640" y="278" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Unknown provider name</text>

        <!-- Level 3 Left: RateLimitExceededError -->
        <rect x="56" y="336" width="208" height="56" rx="6" fill="#0c0e12"/>
        <rect x="56" y="336" width="208" height="56" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.14"/>
        <text x="160" y="360" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="middle">RateLimitExceededError</text>
        <text x="160" y="378" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTP 429 / quota exceeded</text>

        <!-- LEGEND STRIP -->
        <line x1="56" y1="408" x2="744" y2="408" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.10"/>
        <rect x="56" y="420" width="12" height="12" rx="2" fill="#00d2ff" stroke="#00d2ff" stroke-width="1.2" fill-opacity="0.12"/>
        <text x="76" y="430" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Base Library Error</text>

        <rect x="228" y="420" width="12" height="12" rx="2" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.22"/>
        <text x="248" y="430" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Specific Exception</text>

        <rect x="404" y="420" width="12" height="12" rx="2" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.18"/>
        <text x="424" y="430" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Python Built-in</text>
      </svg>
