<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Stock Fetcher Architecture</title>
        <desc id="architecture-desc">Shows how Python SDK, Terminal CLI, and AI MCP entry points route through ClientFactory and BaseFetcher to six stock media provider clients.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #0c0e12;
      --color-paper-2: #13171f;
      --color-ink:     #f8fafc;
      --color-muted:   #94a3b8;
      --color-soft:    #7c8da6;
      --color-accent:  #00d2ff;
      --color-link:    #60a5fa;
      --font-sans:     'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d2ff"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
        </defs>

        <!-- Background -->
        <rect x="0" y="0" width="960" height="520" rx="12" fill="#0c0e12"/>

        <!-- ZONES (drawn first) -->
        <!-- Zone 1: Entry Points -->
        <rect x="24" y="28" width="208" height="404" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="36" y="32" width="104" height="14" rx="2" fill="#0c0e12"/>
        <text x="88" y="42" fill="#7c8da6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">ENTRY POINTS</text>

        <!-- Zone 2: Core Dispatch -->
        <rect x="288" y="28" width="224" height="404" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="300" y="32" width="112" height="14" rx="2" fill="#0c0e12"/>
        <text x="356" y="42" fill="#7c8da6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">CORE DISPATCH</text>

        <!-- Zone 3: Provider Implementations -->
        <rect x="568" y="28" width="368" height="404" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="580" y="32" width="152" height="14" rx="2" fill="#0c0e12"/>
        <text x="656" y="42" fill="#7c8da6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">PROVIDER CLIENTS</text>

        <!-- ARROWS (drawn before nodes) -->
        <!-- Python App -> ClientFactory -->
        <path d="M 216,108 H 244 Q 252,108 252,116 V 124 Q 252,132 260,132 H 302" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- Terminal CLI -> ClientFactory -->
        <path d="M 216,232 H 256 Q 264,232 264,224 V 164 Q 264,156 272,156 H 302" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <!-- AI Agent -> ClientFactory -->
        <path d="M 216,356 H 268 Q 276,356 276,348 V 188 Q 276,180 284,180 H 302" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

        <!-- ClientFactory -> BaseFetcher -->
        <line x1="400" y1="204" x2="400" y2="258" stroke="#00d2ff" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>
        <rect x="410" y="222" width="84" height="16" rx="2" fill="#0c0e12"/>
        <text x="452" y="233" fill="#00d2ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">INSTANTIATE</text>

        <!-- BaseFetcher -> Provider Clients Zone -->
        <line x1="496" y1="308" x2="566" y2="308" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#architecture-arrow-link)"/>
        <rect x="504" y="286" width="56" height="14" rx="2" fill="#0c0e12"/>
        <text x="532" y="296" fill="#60a5fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <!-- NODES -->
        <!-- Entry Point 1: Python Application -->
        <rect x="40" y="64" width="176" height="84" rx="6" fill="#0c0e12"/>
        <rect x="40" y="64" width="176" height="84" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.16"/>
        <rect x="52" y="76" width="34" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="69" y="87" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">SDK</text>
        <text x="52" y="112" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Python Application</text>
        <text x="52" y="132" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">import ClientFactory</text>

        <!-- Entry Point 2: Terminal CLI -->
        <rect x="40" y="188" width="176" height="84" rx="6" fill="#0c0e12"/>
        <rect x="40" y="188" width="176" height="84" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.16"/>
        <rect x="52" y="200" width="34" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="69" y="211" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">CLI</text>
        <text x="52" y="236" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">Terminal CLI</text>
        <text x="52" y="256" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stock-fetcher search</text>

        <!-- Entry Point 3: AI Agent (MCP) -->
        <rect x="40" y="312" width="176" height="84" rx="6" fill="#0c0e12"/>
        <rect x="40" y="312" width="176" height="84" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.16"/>
        <rect x="52" y="324" width="34" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="69" y="335" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">MCP</text>
        <text x="52" y="360" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">AI Agent Server</text>
        <text x="52" y="380" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">JSON-RPC over stdio</text>

        <!-- Core 1: ClientFactory (FOCAL) -->
        <rect x="304" y="108" width="192" height="96" rx="6" fill="#0c0e12"/>
        <rect x="304" y="108" width="192" height="96" rx="6" fill="#00d2ff" stroke="#00d2ff" stroke-width="1.5" fill-opacity="0.08"/>
        <rect x="316" y="120" width="60" height="16" rx="2" fill="#00d2ff" fill-opacity="0.14"/>
        <text x="346" y="131" fill="#00d2ff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">FACTORY</text>
        <text x="316" y="160" fill="#f8fafc" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">ClientFactory</text>
        <text x="316" y="182" fill="#94a3b8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">.get(provider, api_key)</text>

        <!-- Core 2: BaseFetcher -->
        <rect x="304" y="260" width="192" height="96" rx="6" fill="#0c0e12"/>
        <rect x="304" y="260" width="192" height="96" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1.2" stroke-opacity="0.22"/>
        <rect x="316" y="272" width="76" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="354" y="283" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">INTERFACE</text>
        <text x="316" y="312" fill="#f8fafc" font-size="14" font-family="'Geist', system-ui, sans-serif" font-weight="600">BaseFetcher</text>
        <text x="316" y="334" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">search · cache · rate limit</text>

        <!-- Providers Grid (2 cols x 3 rows) -->
        <!-- Pexels -->
        <rect x="584" y="64" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="584" y="64" width="160" height="84" rx="6" fill="#13171f" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="596" y="76" width="48" height="16" rx="2" fill="#60a5fa" fill-opacity="0.12"/>
        <text x="620" y="87" fill="#60a5fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">REST</text>
        <text x="596" y="112" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">PexelsClient</text>
        <text x="596" y="132" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">API key required</text>

        <!-- Pixabay -->
        <rect x="760" y="64" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="760" y="64" width="160" height="84" rx="6" fill="#13171f" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="772" y="76" width="48" height="16" rx="2" fill="#60a5fa" fill-opacity="0.12"/>
        <text x="796" y="87" fill="#60a5fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">REST</text>
        <text x="772" y="112" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">PixabayClient</text>
        <text x="772" y="132" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">API key required</text>

        <!-- Unsplash -->
        <rect x="584" y="188" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="584" y="188" width="160" height="84" rx="6" fill="#13171f" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="596" y="200" width="48" height="16" rx="2" fill="#60a5fa" fill-opacity="0.12"/>
        <text x="620" y="211" fill="#60a5fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">REST</text>
        <text x="596" y="236" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">UnsplashClient</text>
        <text x="596" y="256" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">API key required</text>

        <!-- Openverse -->
        <rect x="760" y="188" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="760" y="188" width="160" height="84" rx="6" fill="#13171f" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.32"/>
        <rect x="772" y="200" width="48" height="16" rx="2" fill="#60a5fa" fill-opacity="0.12"/>
        <text x="796" y="211" fill="#60a5fa" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">REST</text>
        <text x="772" y="236" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">OpenverseClient</text>
        <text x="772" y="256" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Optional API key</text>

        <!-- Wikimedia -->
        <rect x="584" y="312" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="584" y="312" width="160" height="84" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.16"/>
        <rect x="596" y="324" width="64" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="628" y="335" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">MEDIAWIKI</text>
        <text x="596" y="360" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">WikimediaClient</text>
        <text x="596" y="380" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">No auth required</text>

        <!-- Flickr -->
        <rect x="760" y="312" width="160" height="84" rx="6" fill="#0c0e12"/>
        <rect x="760" y="312" width="160" height="84" rx="6" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.16"/>
        <rect x="772" y="324" width="52" height="16" rx="2" fill="#f8fafc" fill-opacity="0.06"/>
        <text x="798" y="335" fill="#94a3b8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">SCRAPER</text>
        <text x="772" y="360" fill="#f8fafc" font-size="13" font-family="'Geist', system-ui, sans-serif" font-weight="600">FlickrClient</text>
        <text x="772" y="380" fill="#7c8da6" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">BeautifulSoup · No key</text>

        <!-- LEGEND STRIP -->
        <line x1="24" y1="456" x2="936" y2="456" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.10"/>
        <rect x="24" y="476" width="12" height="12" rx="2" fill="#00d2ff" stroke="#00d2ff" stroke-width="1.2" fill-opacity="0.12"/>
        <text x="44" y="486" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Focal Router</text>

        <rect x="164" y="476" width="12" height="12" rx="2" fill="#13171f" stroke="#f8fafc" stroke-width="1" stroke-opacity="0.22"/>
        <text x="184" y="486" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Entry / Core</text>

        <rect x="304" y="476" width="12" height="12" rx="2" fill="#13171f" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.40"/>
        <text x="324" y="486" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">REST Provider</text>

        <line x1="448" y1="482" x2="472" y2="482" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#architecture-arrow-link)"/>
        <text x="480" y="486" fill="#94a3b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">Provider Dispatch</text>
      </svg>
