name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,all]"

      - name: Run Ruff (Linting)
        run: ruff check .

      - name: Run Ruff (Formatting Check)
        run: ruff format --check .

      - name: Build Package
        run: |
          pip install build
          python -m build

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Validate Internal Documentation Links
        run: |
          python3 -c '
          import re, glob, os, sys
          broken = []
          for f in glob.glob("**/*.md", recursive=True):
              content = re.sub(r"```[\s\S]*?```", "", open(f, encoding="utf-8").read())
              content = re.sub(r"`[^`]*`", "", content)
              for link in re.findall(r"\[.*?\]\((?!https?://|mailto:)(.*?)(?:#.*)?\)", content):
                  link = link.strip().split("?")[0]
                  if not link or link.startswith("#"): continue
                  target = os.path.normpath(os.path.join(os.path.dirname(f), link))
                  if not os.path.exists(target):
                      broken.append(f"{f} -> {link}")
          if broken:
              print("Broken internal links detected:", broken, file=sys.stderr)
              sys.exit(1)
          print("Internal documentation links verified.")
          '
